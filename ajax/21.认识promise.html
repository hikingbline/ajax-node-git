<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认识Promise</title>
</head>
  
<body>
  <script>
    //promise 表示一个异步操作最终状态和结果值的对象
   const p = new promise((resolve,reject) => {
    setTimeout(()=>{
      // resolve('模拟AJAX请求-成功结果') // 成功
      reject(new Error('模拟AJAX请求失败-失败结果'))
    },2000)
   })

   //3.获取结果
   p.then(result => {
    console.log(result);
   }).catch(error => {
    console.log(error);
   })
  </script>
</body>

</html>
