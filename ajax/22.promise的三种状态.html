<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认识Promise状态</title>
</head>

<body>
  <script>
    //promise的三种状态 
    //作用：一个Promise对象 必然处于以下几种状态之一
    // 1. 创建Promise对象
    //promise对象创建时，里面的代码会立即执行
    //pending 待定状态
    const p = new Promise((resolve, reject) => {
      // 2. 执行异步代码
      setTimeout(() => {
        //resolve()=> 'fulfilled状态-已兑现'   =>then()
        //已敲定之后就不会再改变了
        // resolve('模拟AJAX请求-成功结果')
        reject(new Error('模拟AJAX请求-失败结果'))
      }, 2000)
    })

    console.log(p)

    // 3. 获取结果
    //已兑现状态  fulfilled
    p.then(result => {
      console.log(result)
    //已拒绝状态 rejected
    }).catch(error => {
      console.log(error)
    })


  </script>
</body>

</html>
